<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bohdan Tkachuk — iOS Developer</title>
  <meta name="description" content="Bohdan Tkachuk — iOS developer. Apps, LinkedIn and GitHub.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07060d">
  <style>
    :root {
      --bg:#07060d; --fg:#f4f3fa; --muted:#9b98b0;
      --glass:rgba(255,255,255,.05); --line:rgba(255,255,255,.12);
      --a:#7c5cff; --b:#00d4ff; --c:#ff4fd8;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--fg); overflow-x:hidden;
      font:17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    /* animated background */
    .bg { position:fixed; inset:0; z-index:-2; overflow:hidden; }
    .blob { position:absolute; width:55vmax; height:55vmax; border-radius:50%; filter:blur(90px); opacity:.5; will-change:transform; }
    .blob.one { background:var(--a); top:-20vmax; left:-15vmax; animation:float1 18s ease-in-out infinite alternate; }
    .blob.two { background:var(--b); bottom:-25vmax; right:-15vmax; opacity:.38; animation:float2 22s ease-in-out infinite alternate; }
    .blob.three { background:var(--c); top:30%; left:45%; width:35vmax; height:35vmax; opacity:.25; animation:float3 26s ease-in-out infinite alternate; }
    @keyframes float1 { to { transform:translate(25vmax,18vmax) scale(1.2); } }
    @keyframes float2 { to { transform:translate(-22vmax,-15vmax) scale(.85); } }
    @keyframes float3 { to { transform:translate(-18vmax,12vmax) scale(1.3); } }
    .grid {
      position:fixed; inset:0; z-index:-1; pointer-events:none;
      background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size:56px 56px; opacity:.25;
      -webkit-mask-image:radial-gradient(ellipse at center, #000 20%, transparent 75%);
              mask-image:radial-gradient(ellipse at center, #000 20%, transparent 75%);
    }
    #fx { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
    .cursor-glow {
      position:fixed; width:420px; height:420px; border-radius:50%; pointer-events:none; z-index:-1;
      background:radial-gradient(circle, rgba(124,92,255,.22), transparent 65%);
      transform:translate(-50%,-50%); left:50%; top:30%; transition:opacity .3s;
    }

    main { max-width:680px; margin:0 auto; padding:clamp(56px,12vh,120px) 22px 56px; }

    /* hero */
    .badge {
      display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:99px;
      background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px);
      font-size:.85rem; color:var(--muted); margin-bottom:22px;
    }
    .dot { width:8px; height:8px; border-radius:50%; background:#3dff9a; box-shadow:0 0 0 0 rgba(61,255,154,.7); animation:pulse 2s infinite; }
    @keyframes pulse { 70% { box-shadow:0 0 0 10px rgba(61,255,154,0); } 100% { box-shadow:0 0 0 0 rgba(61,255,154,0); } }

    h1 {
      font-size:clamp(2.6rem,9vw,4.4rem); line-height:1.02; letter-spacing:-.035em; margin:0 0 14px; font-weight:800;
      background:linear-gradient(110deg, #fff 20%, var(--b) 40%, var(--a) 60%, var(--c) 80%, #fff);
      background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
      animation:shine 6s linear infinite;
    }
    @keyframes shine { to { background-position:-250% 0; } }
    .role { font-size:clamp(1.15rem,3.5vw,1.5rem); color:var(--muted); margin:0 0 6px; min-height:1.6em; }
    .caret { display:inline-block; width:2px; height:1.1em; background:var(--b); margin-left:3px; vertical-align:-3px; animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }

    h2 {
      font-size:.78rem; text-transform:uppercase; letter-spacing:.18em; color:var(--muted);
      margin:52px 0 14px; display:flex; align-items:center; gap:12px;
    }
    h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent); }

    /* cards */
    .list { display:grid; gap:12px; perspective:900px; }
    a.item {
      position:relative; display:flex; align-items:center; gap:16px; padding:16px 18px; border-radius:18px;
      background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      color:var(--fg); text-decoration:none; overflow:hidden;
      transition:transform .25s ease, border-color .25s, box-shadow .25s;
      transform-style:preserve-3d; will-change:transform;
    }
    a.item::before { /* spotlight following mouse */
      content:""; position:absolute; inset:0; opacity:0; transition:opacity .3s; pointer-events:none;
      background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(124,92,255,.28), transparent 70%);
    }
    a.item:hover { border-color:rgba(124,92,255,.7); box-shadow:0 12px 40px -12px rgba(124,92,255,.55); }
    a.item:hover::before { opacity:1; }
    a.item:focus-visible { outline:2px solid var(--b); outline-offset:3px; }
    .ico {
      --g1:var(--a); --g2:var(--b);
      position:relative; flex:none; width:50px; height:50px; border-radius:15px; display:grid; place-items:center;
      background:linear-gradient(135deg, var(--g1), var(--g2));
      box-shadow:0 8px 22px -6px var(--g1), inset 0 1px 0 rgba(255,255,255,.35);
      transition:transform .45s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
    }
    .ico::before { /* spinning glow ring */
      content:""; position:absolute; inset:-3px; border-radius:18px; z-index:-1; opacity:0; transition:opacity .3s;
      background:conic-gradient(from 0deg, var(--g1), var(--g2), var(--c), var(--g1));
      filter:blur(6px); animation:spin 3s linear infinite paused;
    }
    .ico::after { /* shine sweep */
      content:""; position:absolute; inset:0; border-radius:inherit; overflow:hidden;
      background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
      background-size:250% 100%; background-position:150% 0; transition:background-position .7s;
    }
    a.item:hover .ico { transform:scale(1.14) rotate(-8deg); box-shadow:0 12px 30px -4px var(--g1), inset 0 1px 0 rgba(255,255,255,.4); }
    a.item:hover .ico::before { opacity:.9; animation-play-state:running; }
    a.item:hover .ico::after { background-position:-50% 0; }
    .ico svg { position:relative; z-index:1; width:26px; height:26px; fill:#fff; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); animation:bob 3.6s ease-in-out infinite; }
    a.item:hover .ico svg { animation:wiggle .6s ease; }
    .ico.apple    { --g1:#8e8e93; --g2:#2c2c2e; }
    .ico.store    { --g1:#2dd4ff; --g2:#1a6bff; }
    .ico.github   { --g1:#a66bff; --g2:#3b2a8f; }
    .ico.linkedin { --g1:#2f9bff; --g2:#0a4fb3; }
    .ico.mail     { --g1:#ff7ab8; --g2:#ff5a36; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes bob { 50% { transform:translateY(-2px); } }
    @keyframes wiggle { 25% { transform:rotate(-14deg) scale(1.1); } 55% { transform:rotate(10deg) scale(1.1); } 100% { transform:rotate(0); } }
    .txt { flex:1; min-width:0; }
    .txt b { display:block; font-weight:650; }
    .txt small { color:var(--muted); font-size:.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
    .arrow { color:var(--muted); transition:transform .25s, color .25s; font-size:1.2rem; }
    a.item:hover .arrow { transform:translate(4px,-4px); color:var(--fg); }

    footer { margin-top:64px; color:var(--muted); font-size:.85rem; text-align:center; }

    /* entrance animation */
    .reveal { opacity:0; transform:translateY(24px); animation:in .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i,0) * 110ms + 100ms); }
    @keyframes in { to { opacity:1; transform:none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001s !important; animation-iteration-count:1 !important; transition:none !important; }
    }
  </style>
</head>
<body>

  <canvas id="fx"></canvas>
  <div class="grid"></div>
  <div class="cursor-glow" id="glow"></div>

  <main>

  <script>
    // typing effect
    (function () {
      var words = ["iOS Developer", "App Store publisher", "Building things for iPhone"];
      var el = document.getElementById("type"), w = 0, c = 0, del = false;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = words[0]; return; }
      function tick() {
        var word = words[w];
        el.textContent = word.slice(0, c);
        if (!del && c === word.length) { del = true; return setTimeout(tick, 1600); }
        if (del && c === 0) { del = false; w = (w + 1) % words.length; return setTimeout(tick, 350); }
        c += del ? -1 : 1;
        setTimeout(tick, del ? 30 : 70);
      }
      setTimeout(tick, 900);
    })();


    // living background: floating iPhones + app icons
    (function () {
      var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var W, H, dpr, items = [], mx = 0, my = 0, tx = 0, ty = 0, t = 0;
      var PAL = [["#7c5cff", "#00d4ff"], ["#ff4fd8", "#7c5cff"], ["#00d4ff", "#3dff9a"], ["#ff7a45", "#ff4fd8"], ["#2f9bff", "#7c5cff"]];

      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      }

      function size() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
        items = [];
        var phones = innerWidth < 700 ? 4 : 7, icons = innerWidth < 700 ? 10 : 18, i;
        for (i = 0; i < phones; i++) items.push({
          k: "phone", x: Math.random() * W, y: Math.random() * H, z: .35 + Math.random() * .65,
          s: (70 + Math.random() * 60) * dpr, rot: (Math.random() - .5) * .9, vr: (Math.random() - .5) * .0016,
          vy: -(.12 + Math.random() * .25) * dpr, ph: Math.random() * 6.28, pal: PAL[i % PAL.length]
        });
        for (i = 0; i < icons; i++) items.push({
          k: "icon", x: Math.random() * W, y: Math.random() * H, z: .3 + Math.random() * .7,
          s: (20 + Math.random() * 20) * dpr, rot: (Math.random() - .5) * .8, vr: (Math.random() - .5) * .003,
          vy: -(.18 + Math.random() * .35) * dpr, ph: Math.random() * 6.28, pal: PAL[(i + 2) % PAL.length]
        });
        items.sort(function (a, b) { return a.z - b.z; });
      }
      addEventListener("resize", size); size();
      addEventListener("pointermove", function (e) { tx = (e.clientX / innerWidth - .5); ty = (e.clientY / innerHeight - .5); });

      function phone(it, x, y) {
        var w = it.s, h = it.s * 2.05, r = w * .2;
        ctx.save(); ctx.translate(x, y); ctx.rotate(it.rot + Math.sin(t * .5 + it.ph) * .08);
        ctx.globalAlpha = .12 + it.z * .38;
        // body glow
        ctx.shadowColor = it.pal[0]; ctx.shadowBlur = 28 * dpr * it.z;
        rr(-w / 2, -h / 2, w, h, r);
        ctx.fillStyle = "rgba(10,9,20,.75)"; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2 * dpr; var g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
        g.addColorStop(0, it.pal[0]); g.addColorStop(1, it.pal[1]); ctx.strokeStyle = g; ctx.stroke();
        // screen
        var m = w * .07; rr(-w / 2 + m, -h / 2 + m, w - 2 * m, h - 2 * m, r * .75);
        var sg = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
        sg.addColorStop(0, it.pal[0] + "55"); sg.addColorStop(1, it.pal[1] + "22"); ctx.fillStyle = sg; ctx.fill();
        // dynamic island
        rr(-w * .17, -h / 2 + m * 1.7, w * .34, w * .1, w * .05); ctx.fillStyle = "#000"; ctx.fill();
        // mini app grid, pulsing
        var cols = 3, rows = 4, cell = (w - 2 * m) / (cols + .6), gx = -w / 2 + m + cell * .4, gy = -h / 2 + m * 5;
        for (var yy = 0; yy < rows; yy++) for (var xx = 0; xx < cols; xx++) {
          var pu = .5 + .5 * Math.sin(t * 1.6 + it.ph + xx * .9 + yy * .7);
          rr(gx + xx * cell * 1.05, gy + yy * cell * 1.05, cell * .7, cell * .7, cell * .2);
          ctx.fillStyle = (xx + yy) % 2 ? it.pal[0] : it.pal[1]; ctx.globalAlpha = (.12 + it.z * .38) * (.35 + pu * .65); ctx.fill();
        }
        ctx.globalAlpha = .12 + it.z * .38;
        // home indicator
        rr(-w * .18, h / 2 - m * 2.2, w * .36, w * .035, w * .02); ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fill();
        ctx.restore();
      }

      function icon(it, x, y) {
        var s = it.s;
        ctx.save(); ctx.translate(x, y); ctx.rotate(it.rot + Math.sin(t * .7 + it.ph) * .12);
        ctx.globalAlpha = .15 + it.z * .5; ctx.shadowColor = it.pal[0]; ctx.shadowBlur = 18 * dpr * it.z;
        rr(-s / 2, -s / 2, s, s, s * .225);
        var g = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
        g.addColorStop(0, it.pal[0]); g.addColorStop(1, it.pal[1]); ctx.fillStyle = g; ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,255,255,.28)";
        rr(-s / 2, -s / 2, s, s * .5, s * .225); ctx.fill();
        ctx.restore();
      }

      function frame() {
        t += .016; mx += (tx - mx) * .04; my += (ty - my) * .04;
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          it.y += it.vy * (reduce ? 0 : 1); it.rot += it.vr * (reduce ? 0 : 1);
          var m = it.s * 2.5;
          if (it.y < -m) { it.y = H + m; it.x = Math.random() * W; }
          var x = it.x + Math.sin(t * .6 + it.ph) * 18 * dpr - mx * 90 * it.z * dpr;
          var y = it.y + Math.cos(t * .5 + it.ph) * 12 * dpr - my * 90 * it.z * dpr;
          (it.k === "phone" ? phone : icon)(it, x, y);
        }
        if (!reduce) requestAnimationFrame(frame);
      }
      frame();
    })();

    // cursor glow
    var glow = document.getElementById("glow");
    window.addEventListener("pointermove", function (e) {
      glow.style.left = e.clientX + "px"; glow.style.top = e.clientY + "px";
    });

    // 3D tilt + spotlight on cards
    document.querySelectorAll("a.item").forEach(function (card) {
      card.addEventListener("pointermove", function (e) {
        var r = card.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
        card.style.setProperty("--mx", x + "px"); card.style.setProperty("--my", y + "px");
        var rx = ((y / r.height) - .5) * -8, ry = ((x / r.width) - .5) * 8;
        card.style.transform = "rotateX(" + rx + "deg) rotateY(" + ry + "deg) translateY(-2px)";
      });
      card.addEventListener("pointerleave", function () { card.style.transform = ""; });
    });
  </script>
</body>
